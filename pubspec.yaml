name: hanbut
description: 구름을 한 번에 이어 기록을 쌓는 캐주얼 퍼즐 게임.
publish_to: none
version: 1.1.1+38
environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  audioplayers: ^5.2.1
  supabase_flutter: ^2.0.0
  google_mobile_ads: ^7.0.0
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
  - assets/images/clo_card.png
  - assets/audio/clear.wav
  - assets/audio/fail.wav
  - assets/audio/milestone.wav
flutter_launcher_icons:
  image_path: assets/icons/smiling_cloud.png
  ios: true
  android: true
  remove_alpha_ios: true
  min_sdk_android: 21
